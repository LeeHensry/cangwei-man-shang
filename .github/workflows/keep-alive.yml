name: Keep Alive & Sync

on:
  schedule:
    # 每10分钟ping一次保活
    - cron: '*/10 * * * *'
    # 工作日盘中同步：北京时间10:00/11:30/14:00 = UTC 02:00/03:30/06:00
    - cron: '0 2 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '0 6 * * 1-5'
    # 收盘后全量同步：北京时间15:35 = UTC 07:35
    - cron: '35 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '同步模式'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - incremental

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health ping
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://cangwei-man-shang.onrender.com/api/version)
          echo "Status: $STATUS"

  sync:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 2 * * 1-5' ||
        github.event.schedule == '30 3 * * 1-5' ||
        github.event.schedule == '0 6 * * 1-5' ||
        github.event.schedule == '35 7 * * 1-5'
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Determine sync mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "35 7 * * 1-5" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=incremental" >> $GITHUB_OUTPUT
          fi

      - name: Wait for cold start
        run: sleep 20

      - name: Trigger sync (wait for completion)
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          echo "=== Triggering $MODE sync (wait mode) ==="
          RESULT=$(curl -s --max-time 600 -X POST "https://cangwei-man-shang.onrender.com/api/sync?wait=1" \
            -H "Content-Type: application/json" \
            -d "{\"mode\":\"$MODE\",\"wait\":true}")
          echo "Sync result: $RESULT"

      - name: Verify data
        run: |
          sleep 5
          STATS=$(curl -s --max-time 30 https://cangwei-man-shang.onrender.com/api/db/stats)
          echo "DB stats: $STATS"
