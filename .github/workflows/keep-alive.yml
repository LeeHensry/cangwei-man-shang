name: Keep Alive & Sync

on:
  schedule:
    # 每10分钟ping一次保活
    - cron: '*/10 * * * *'
    # 工作日盘中同步：北京时间10:00/11:30/14:00 = UTC 02:00/03:30/06:00
    - cron: '0 2 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '0 6 * * 1-5'
    # 收盘后全量同步：北京时间15:35 = UTC 07:35
    - cron: '35 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '同步模式'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - incremental

jobs:
  # 纯保活：每10分钟ping，3分钟超时（冷启动时间）
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://cangwei-man-shang.onrender.com/api/version)
            echo "Ping $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 10
          done

  # 定时同步：触发后持续ping保活6分钟让后台同步完成
  sync:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 2 * * 1-5' ||
        github.event.schedule == '30 3 * * 1-5' ||
        github.event.schedule == '0 6 * * 1-5' ||
        github.event.schedule == '35 7 * * 1-5'
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Determine sync mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "35 7 * * 1-5" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=incremental" >> $GITHUB_OUTPUT
          fi

      - name: Warm up
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://cangwei-man-shang.onrender.com/api/version)
            echo "Warmup $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 15
          done

      - name: Trigger sync
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          echo "Triggering $MODE sync..."
          curl -s --max-time 30 -X POST https://cangwei-man-shang.onrender.com/api/sync \
            -H "Content-Type: application/json" \
            -d "{\"mode\":\"$MODE\"}"
          echo ""

      - name: Keep alive during sync (ping every 25s for 6 min)
        run: |
          echo "Keeping instance alive during sync..."
          for i in $(seq 1 15); do
            sleep 25
            STATS=$(curl -s --max-time 15 https://cangwei-man-shang.onrender.com/api/db/stats)
            echo "[$((i*25))s] $STATS"
          done

      - name: Verify latest data
        run: |
          sleep 10
          TODAY=$(date -u +%Y%m%d)
          STATS=$(curl -s --max-time 30 https://cangwei-man-shang.onrender.com/api/db/stats)
          echo "Final stats: $STATS"
          echo "Today is UTC: $TODAY"
          if echo "$STATS" | grep -q "\"latest_date\":\"$TODAY\""; then
            echo "✅ Data is up to date"
          else
            echo "⚠️ Data may not be fully synced yet"
          fi
