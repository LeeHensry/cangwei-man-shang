name: Keep Alive & Sync

on:
  schedule:
    # 每10分钟ping一次保活
    - cron: '*/10 * * * *'
    # 工作日盘中同步：北京时间10:00/11:30/14:00 = UTC 02:00/03:30/06:00
    - cron: '0 2 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '0 6 * * 1-5'
    # 收盘后分步同步：北京时间15:35 = UTC 07:35
    - cron: '35 7 * * 1-5'
    # 分步同步续跑：北京时间15:55/16:15/16:35 = UTC 07:55/08:15/08:35
    - cron: '55 7 * * 1-5'
    - cron: '15 8 * * 1-5'
    - cron: '35 8 * * 1-5'
  workflow_dispatch:
    inputs:
      step:
        description: '同步步骤'
        required: false
        default: 'full-pipeline'
        type: choice
        options:
          - full-pipeline
          - kline
          - indicators
          - score
          - crowding
          - pool

jobs:
  # 纯保活：每10分钟ping，3分钟超时（冷启动时间）
  healthcheck:
    if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://cangwei-man-shang.onrender.com/api/version)
            echo "Ping $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 10
          done

  # 定时分步同步
  sync:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 2 * * 1-5' ||
        github.event.schedule == '30 3 * * 1-5' ||
        github.event.schedule == '0 6 * * 1-5' ||
        github.event.schedule == '35 7 * * 1-5' ||
        github.event.schedule == '55 7 * * 1-5' ||
        github.event.schedule == '15 8 * * 1-5' ||
        github.event.schedule == '35 8 * * 1-5'
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Determine sync step
        id: step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "step=${{ github.event.inputs.step }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "35 7 * * 1-5" ]; then
            echo "step=full-pipeline" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "55 7 * * 1-5" ]; then
            echo "step=full-pipeline" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 8 * * 1-5" ]; then
            echo "step=full-pipeline" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "35 8 * * 1-5" ]; then
            echo "step=full-pipeline" >> $GITHUB_OUTPUT
          else
            echo "step=full-pipeline" >> $GITHUB_OUTPUT
          fi

      - name: Warm up
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://cangwei-man-shang.onrender.com/api/version)
            echo "Warmup $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 15
          done

      - name: Check current status
        run: |
          echo "=== Current DB Status ==="
          STATUS=$(curl -s --max-time 30 https://cangwei-man-shang.onrender.com/api/sync/step -X POST -H "Content-Type: application/json" -d '{"step":"status"}')
          echo "$STATUS"

      - name: Run sync step
        run: |
          STEP="${{ steps.step.outputs.step }}"
          echo "=== Running step: $STEP ==="

          # full-pipeline: 循环调用直到完成或超5分钟
          if [ "$STEP" = "full-pipeline" ]; then
            for i in $(seq 1 6); do
              echo "--- Pipeline iteration $i ---"
              RESULT=$(curl -s --max-time 55 -X POST https://cangwei-man-shang.onrender.com/api/sync/step \
                -H "Content-Type: application/json" \
                -d '{"step":"full-pipeline","full":true}')
              echo "$RESULT"
              # 检查是否全部完成
              if echo "$RESULT" | grep -q '"all-done"'; then
                echo "✅ Pipeline complete!"
                break
              fi
              sleep 5
            done
          else
            # 单步执行
            RESULT=$(curl -s --max-time 55 -X POST https://cangwei-man-shang.onrender.com/api/sync/step \
              -H "Content-Type: application/json" \
              -d "{\"step\":\"$STEP\"}")
            echo "$RESULT"
          fi

      - name: Final status check
        run: |
          sleep 5
          STATUS=$(curl -s --max-time 30 https://cangwei-man-shang.onrender.com/api/sync/step -X POST -H "Content-Type: application/json" -d '{"step":"status"}')
          echo "=== Final Status ==="
          echo "$STATUS"
