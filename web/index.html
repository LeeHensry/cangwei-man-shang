<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仓位满上 TopUp</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg: #FAFAFA;
      --bg-sidebar: #FFFFFF;
      --bg-elevated: #FFFFFF;
      --bg-hover: #F5F5F7;
      --bg-muted: #F8FAFC;
      --border: #E8E8ED;
      --border-strong: #D2D2D7;
      --fg: #1A1A1E;
      --fg-secondary: #3A3A3C;
      --fg-muted: #8E8E93;
      --fg-faint: #AEAEB2;
      --accent: #0052FF;
      --accent-secondary: #4D7CFF;
      --accent-soft: rgba(0,82,255,0.06);
      --accent-border: rgba(0,82,255,0.2);
      --up: #EF4444;
      --up-text: #DC2626;
      --up-soft: rgba(239,68,68,0.08);
      --down: #22C55E;
      --down-text: #16A34A;
      --down-soft: rgba(34,197,94,0.08);
      --warn: #F59E0B;
      --warn-text: #D97706;
      --warn-soft: rgba(245,158,11,0.1);
      --purple: #A855F7;
      --purple-soft: rgba(168,85,247,0.08);
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
      --shadow-accent: 0 4px 14px rgba(0,82,255,0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--fg);
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ===== Sidebar ===== */
    .nav-logo {
      padding: 0 18px !important;
      display: flex; align-items: center; gap: 10px;
      height: 56px; border-bottom: 1px solid var(--border) !important;
    }
    .logo-icon {
      width: 34px !important; height: 34px !important;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-text {
      font-size: 15px !important; font-weight: 700 !important;
      color: var(--fg) !important; letter-spacing: -0.01em; line-height: 1.2;
    }
    .logo-sub {
      font-size: 10px !important; color: var(--fg-faint) !important;
      font-family: var(--font-mono) !important; letter-spacing: 1.5px;
      font-weight: 500; margin-top: 2px !important;
    }

    /* ===== Signal Badges ===== */
    .signal-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .signal-buy { background: var(--up-soft); color: var(--up-text); }
    .signal-momentum_buy { background: var(--purple-soft); color: #9333EA; }
    .signal-watch { background: var(--warn-soft); color: var(--warn-text); }
    .signal-hold { background: var(--accent-soft); color: var(--accent); }
    .signal-sell { background: var(--down-soft); color: var(--down-text); }

    /* ===== Score Badge ===== */
    .score-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 24px; border-radius: 7px;
      font-size: 12px; font-weight: 700; font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .score-high { background: var(--up-soft); color: var(--up-text); }
    .score-mid { background: var(--warn-soft); color: var(--warn-text); }
    .score-low { background: var(--bg-hover); color: var(--fg-muted); }

    /* ===== Cards ===== */
    .mini-chart-card {
      transition: transform 200ms ease, box-shadow 200ms ease;
      cursor: default;
    }
    .mini-chart-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg) !important;
    }
    .card-gradient {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%) !important;
      border: none !important; color: #fff;
    }
    .card-gradient .ant-card-head-title { color: #fff !important; }
    .card-gradient .ant-statistic-title { color: rgba(255,255,255,0.75) !important; }
    .card-gradient .ant-statistic-content { color: #fff !important; }

    /* ===== Utility ===== */
    .up { color: var(--up) !important; }
    .down { color: var(--down) !important; }
    .num-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ===== Focus Ring ===== */
    a:focus-visible, button:focus-visible, .ant-btn:focus-visible,
    .ant-input:focus-visible, .ant-select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ===== Transitions ===== */
    .ant-btn, .ant-tag, .ant-menu-item, .ant-table-tbody > tr {
      transition: all 150ms ease-out !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
